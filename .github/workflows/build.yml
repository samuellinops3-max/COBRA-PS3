name: Build PKG
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          make
          ls -lh
      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: Slither-PS3-PKG
          path: "*.pkg"