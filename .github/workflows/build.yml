name: Build PKG
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar SFO
        run: python3 make_sfo.py
      - name: Compilar
        run: make
      - name: Virar PKG
        run: cp slither slither.pkg
      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: slither-pkg
          path: slither.pkg