name: Build PS3 PKG
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar icone
        run: |
          python3 -c "from PIL import Image; Image.new('RGB',(320,176),(0,200,0)).save('ICON0.PNG')"
      - name: Compilar
        run: |
          make clean
          make
          ls -lh
          make pkg
          ls -lh *.pkg
      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: Slither PS3
          files: "*.pkg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}